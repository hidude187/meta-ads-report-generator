name: Bug report
description: Something looks wrong in the tool or in an exported report
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please do not paste real client data. If the problem is a CSV that does not load or shows wrong numbers, paste only the header row.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what did you get instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Upload a CSV with ...
        2. Click ...
        3. See ...
    validations:
      required: true
  - type: textarea
    id: csv-header
    attributes:
      label: CSV header row (optional)
      description: Only the column names from the first line of your export, no client data.
  - type: input
    id: environment
    attributes:
      label: Browser and operating system
      placeholder: Chrome on Windows 11
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or extra context
